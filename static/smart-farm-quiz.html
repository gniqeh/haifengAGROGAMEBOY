<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>智慧农业闯关</title><style>
:root{--g:#2ee6a8;--b:#38bdf8;--y:#fbbf24;--r:#fb7185;--bg:#04141a;--tx:#eefcf7;--dm:#9bbdb3;--card:#ffffff0d;--bd:#ffffff20}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:radial-gradient(circle at 15% 10%,#0b3b3a,transparent 34%),radial-gradient(circle at 90% 85%,#0a2a46,transparent 35%),#04141a;color:var(--tx);touch-action:manipulation;user-select:none}.app{width:100vw;height:100vh;padding:26px 46px;display:flex;flex-direction:column}.screen{display:none;width:100%;height:100%}.screen.on{display:flex}.center{align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:20px}.badge{padding:8px 18px;border:1px solid #2ee6a866;background:#2ee6a812;border-radius:99px;color:#bff8e2;font-size:18px;letter-spacing:2px}.hero{font-size:82px}.title{font-size:64px;margin:0;background:linear-gradient(90deg,#fff,var(--g),#7dd3fc);color:transparent;background-clip:text}.sub{font-size:22px;color:var(--dm);line-height:1.6;margin:0}.chips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.chip{padding:10px 18px;border:1px solid var(--bd);border-radius:99px;font-size:17px;background:#ffffff0b}.btn{border:0;border-radius:24px;padding:20px 42px;background:linear-gradient(100deg,var(--g),#7dd3fc);color:#03251c;font-size:25px;font-weight:900;cursor:pointer;min-width:280px}.btn:active,.opt:active{transform:scale(.985)}.levelnum{font-size:100px;font-weight:900;color:var(--g)}.levelname{font-size:44px;margin:0}.leveldesc{font-size:21px;color:var(--dm)}#quiz{flex-direction:column}.hud{height:64px;display:flex;align-items:center;justify-content:space-between;font-size:20px}.meta{display:flex;gap:12px}.pill{border:1px solid var(--bd);background:#ffffff0b;border-radius:99px;padding:10px 18px}.pill b{color:var(--y)}.tracks{display:grid;gap:6px;margin-bottom:12px}.track{height:9px;background:#ffffff12;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--g),var(--b));transition:width .1s}.card{flex:1;min-height:0;border:1px solid var(--bd);background:linear-gradient(180deg,#ffffff12,#ffffff07);border-radius:28px;padding:24px 30px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:14px;box-shadow:0 20px 60px #0006}.qnum{color:var(--dm);font-size:17px}.qrow{display:flex;align-items:center;gap:16px}.qicon{font-size:44px}.qtext{font-size:31px;font-weight:900;line-height:1.38;margin:0}.opts{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;min-height:0}.opt{border:2px solid var(--bd);background:#ffffff0b;color:var(--tx);border-radius:22px;padding:18px 22px;font-size:23px;font-weight:700;line-height:1.35;text-align:left;display:flex;align-items:center;gap:16px;cursor:pointer;min-height:128px}.k{flex:0 0 52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#ffffff12;font-size:23px;font-weight:900}.opt.right{border-color:var(--g);background:#2ee6a827}.opt.wrong{border-color:var(--r);background:#fb718525}.opt.fade{opacity:.4}.fb{display:none;border:1px solid var(--bd);border-radius:20px;padding:14px 18px;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}.fb.show{display:grid}.fb.ok{border-color:#2ee6a877;background:#2ee6a813}.fb.no{border-color:#fb718577;background:#fb718513}.fi{font-size:32px}.fh{font-size:22px;font-weight:900}.tip{font-size:19px;line-height:1.5;margin:4px 0 0;color:#d8f2e9}.fb .btn{min-width:180px;font-size:21px;padding:16px 24px}.answered .card{grid-template-rows:auto auto 210px minmax(0,1fr)}.answered .opt{min-height:82px;font-size:18px;padding:10px 16px}.answered .k{width:38px;height:38px;font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:min(1100px,90vw)}.stat{border:1px solid var(--bd);background:#ffffff0b;border-radius:20px;padding:24px}.stat b{display:block;font-size:42px;color:var(--g)}.stat span{color:var(--dm);font-size:17px}.stars{font-size:58px;letter-spacing:12px}.rank{font-size:46px;color:var(--y);font-weight:900}.review{max-width:1050px;font-size:18px;line-height:1.5;color:var(--dm);max-height:150px;overflow:hidden}.row{display:flex;gap:18px}.ghost{background:transparent;border:2px solid var(--bd);color:var(--tx)}@media(max-width:1199px){html,body{overflow:auto}.app{height:auto;min-height:100vh}.opts{grid-template-columns:1fr}.screen{min-height:900px}}
</style></head><body><div class="app">
<section id="start" class="screen on center"><div class="badge">🌾 高素质农民培训 · 农业信息化专题</div><div class="hero">🛰️</div><h1 class="title">智慧农业闯关</h1><p class="sub">4 个关卡 · 20 道题 · 遥感 · 物联网 · 电商直播 · 经济作物 · AI<br>全程点击屏幕即可完成</p><div class="chips"><span class="chip">🛰️ 天空之眼</span><span class="chip">📱 手机种地</span><span class="chip">🎬 直播带货</span><span class="chip">🍓 经济作物</span><span class="chip">🤖 AI 助农</span></div><button class="btn" id="startBtn">开始闯关</button></section>
<section id="level" class="screen center"><div class="levelnum" id="levelNum">第1关</div><div class="hero" id="levelIcon">🌱</div><h2 class="levelname" id="levelName"></h2><p class="leveldesc" id="levelDesc"></p><button class="btn" id="goBtn">进入本关 →</button></section>
<section id="quiz" class="screen"><div class="hud"><div id="hudLevel">数字农业启蒙</div><div class="meta"><span class="pill">得分 <b id="score">0</b></span><span class="pill">连击 <b id="combo">0</b></span></div></div><div class="tracks"><div class="track"><div class="fill" id="timeFill"></div></div><div class="track"><div class="fill" id="progFill"></div></div></div><div class="card"><div class="qnum" id="qnum"></div><div class="qrow"><span class="qicon" id="qicon"></span><p class="qtext" id="qtext"></p></div><div class="opts" id="opts"></div><div class="fb" id="fb"><span class="fi" id="fi">✅</span><div><div class="fh" id="fh"></div><p class="tip" id="tip"></p></div><button class="btn" id="nextBtn">继续 →</button></div></div></section>
<section id="levelend" class="screen center"><div class="badge" id="levelBadge"></div><div class="stars" id="stars"></div><h2 class="levelname" id="levelTitle"></h2><div class="stats"><div class="stat"><b id="lr">0</b><span>本关答对</span></div><div class="stat"><b id="lg">0</b><span>本关得分</span></div><div class="stat"><b id="lt">0</b><span>累计总分</span></div></div><button class="btn" id="nextLevelBtn">下一关 →</button></section>
<section id="final" class="screen center"><div class="hero" id="trophy">🏆</div><div class="badge">培训闯关完成</div><div class="rank" id="rank"></div><p class="sub" id="word"></p><div class="stats"><div class="stat"><b id="fs">0</b><span>总得分</span></div><div class="stat"><b id="fa">0%</b><span>正确率</span></div><div class="stat"><b id="fc">0</b><span>最高连击</span></div></div><div class="review" id="review"></div><div class="row"><button class="btn" id="againBtn">再来一局</button><button class="btn ghost" id="homeBtn">返回首页</button></div></section>
</div><script>
const LEVELS=[
{name:'数字农业启蒙',icon:'🌱',desc:'先认识一下手机上就能用的农业新工具',questions:[
['想在手机上实时看到自家大棚里的作物长势，最方便的做法是？',['安装农业监控摄像头','每天骑车去棚里看一眼','请邻居帮忙转述','看天气预报'],0,'农业监控摄像头 + 手机 App，坐在家里也能“看棚”，是智慧农业最常见的入门设备。'],
['智慧农业里“手机一点就能自动浇水施肥”，主要靠哪套系统？',['水肥一体化智能灌溉系统','人工挑水','手摇水泵','挖水渠'],0,'水肥一体化系统按设定的时间和用量自动供水供肥，省工省水还更均匀。'],
['自家农产品贴上二维码，消费者扫码能看到什么？',['产地、检测报告等溯源信息','只能看到价格','一段广告视频','一个小游戏'],0,'这就是农产品质量追溯，扫一扫就知道“从哪来、谁种的、合不合格”，价格能卖得更好。'],
['农业信息化给农民带来的最大好处是？',['省时省力，种地决策更准','以后完全不用种地了','一定能让产量翻十倍','不用再学新技术'],0,'信息化是帮手不是替身：它让你少跑腿、少凭感觉，用数据把地种得更明白。'],
['手机上装一个农业气象 App，对种地最大的帮助是？',['提前知道降温降雨，及时安排农事','让天气变得更好','自动帮你把种播下去','代替施肥打药'],0,'农业气象服务能提前预警霜冻、暴雨、连阴天，抢在天气前面收种管，减少损失。']]},
{name:'天空之眼',icon:'🛰️',desc:'遥感卫星、无人机、传感器，从天上到地下的数据网',questions:[
['遥感卫星拍农田，最常用来做什么？',['判断作物长势和种植面积','给庄稼拍照片发朋友圈','测量村民身高','预测彩票号码'],0,'遥感能大范围看出哪块地长得好、哪块地缺水缺肥，还能估产和查耕地面积。'],
['无人机在农业上最典型的用途是？',['精准喷洒农药和叶面肥','空中拉货送快递','当路灯照明','驱赶蚊子'],0,'无人机打药速度快、雾化细、药量省，还能避免人进田踩苗、接触农药。'],
['埋在土里能自动上报土壤湿度的设备，属于什么技术？',['物联网传感器','打印机','电饭煲','计算器'],0,'传感器负责“感知”，网络负责“上报”，合起来就是农业物联网。'],
['在遥感图像上，作物长势好的地块通常呈现什么颜色？',['更浓的绿色','黑色','深蓝色','纯白色'],0,'长势旺、叶面积大的地块在遥感图上绿色更浓，颜色偏浅或发黄就要留意了。'],
['农田边立着的小型农业气象站，主要能测哪些数据？',['温度、湿度、风速、降雨量','土壤里有几条虫子','明天的蔬菜收购价','手机还剩多少话费'],0,'气象站把温度、湿度、风速、雨量等自动上报到手机，配合灌溉和打药决策非常好用。']]},
{name:'电商直播间',icon:'🎬',desc:'手机就是新农具，直播就是新农活',questions:[
['直播卖自家水果，最能打动买家的做法是？',['现场切开试吃，真实展示果子','只反复说“全网最好”','不停催单刷屏','用别人家的产品图'],0,'真实就是最好的营销：现场试吃、展示果园环境，买家信任度立刻上来。'],
['“农产品上行”指的是？',['把农产品卖到城市消费者手中','把农产品堆在仓库上层','把化肥运进村里','把蔬菜种在山坡上'],0,'农产品上行，就是靠电商、直播、快递把农产品卖到城市消费者手中。'],
['网上开店卖农产品，第一步通常要做什么？',['完成实名认证并办理相关资质','先找人刷单','先把价格涨上去','先关闭评论区'],0,'实名认证和食品、生鲜等相应资质是开店的基础，合规经营才能长久。'],
['直播带货想长期做下去，最后拼的是什么？',['产品品质稳定、售后靠谱','每天换一种产品卖','一味靠低价','看谁嗓门大'],0,'流量来得快也走得快，留住回头客的永远是稳定的品质和靠得住的售后。'],
['直播介绍自家蜂蜜时，下面哪种说法是违规的？',['宣称“能治病、防癌”','现场冲一杯给你看','展示检测合格报告','如实说明规格和产地'],0,'农产品不是药品，不能宣传治疗、防癌等功效，夸大宣传会被处罚，也可能砸了口碑。']]},
{name:'经济作物与 AI',icon:'🤖',desc:'种得值钱、管得聪明，AI 时代的田间地头',questions:[
['下面哪一种属于“经济作物”？',['中药材','小麦','玉米','水稻'],0,'中药材、茶叶、果树、蔬菜、花卉等以经济收益为主要目的的作物属于经济作物；小麦玉米水稻是粮食作物。'],
['用手机拍一张叶片照片就能识别病虫害，用的是哪项技术？',['人工智能图像识别','手电筒','计算器','望远镜'],0,'AI 图像识别把照片和数据库比对，几秒钟给出病虫害名称和用药建议。'],
['种大棚草莓想让上市更早、卖价更高，可以怎么做？',['用大棚控温控湿调节生长节奏','拼命多浇水','把棚膜全拆掉','完全不施肥'],0,'设施农业的核心就是“调环境”，把温度、湿度、光照控住，就能错峰上市卖出好价钱。'],
['农业“智慧大脑”能帮农民做什么？',['根据数据给出种植、施肥、销售建议','直接替农民下地干活','保证永远没有病虫害','让天气变好'],0,'智慧大脑把气象、土壤、市场数据合在一起算，给出建议，最终拍板的还是你。'],
['种茶叶、中药材这类经济作物，想卖出好价钱，最靠谱的做法是？',['提升品质，分级包装走品牌路线','好坏混在一起装一车卖','越早采摘越值钱','只卖给一个收购商'],0,'经济作物讲“优质优价”：把品质做上去、按等级分开卖、打出自己的牌子，价格才稳得住。']]}
];
const $=id=>document.getElementById(id),screens=['start','level','quiz','levelend','final'];let s={li:0,qi:0,score:0,combo:0,maxCombo:0,right:0,total:0,levelRight:0,levelScore:0,time:20,timer:null,locked:false,cur:[],last:-1,records:[]};
function show(id){screens.forEach(x=>$(x).classList.toggle('on',x===id))}function shuffled(q){let a=q[1].map((t,i)=>({t,ok:i===q[2]}));for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}let r=a.findIndex(x=>x.ok);if(r===s.last){let o=[0,1,2,3].filter(x=>x!==r),z=o[Math.floor(Math.random()*o.length)];[a[r],a[z]]=[a[z],a[r]];r=z}s.last=r;return a}
function start(){Object.assign(s,{li:0,qi:0,score:0,combo:0,maxCombo:0,right:0,total:0,levelRight:0,levelScore:0,time:20,locked:false,last:-1,records:[]});intro()}function intro(){let l=LEVELS[s.li];$('levelNum').textContent='第 '+(s.li+1)+' 关';$('levelIcon').textContent=l.icon;$('levelName').textContent=l.name;$('levelDesc').textContent=l.desc;s.levelRight=0;s.levelScore=0;show('level')}function beginLevel(){$('hudLevel').textContent=LEVELS[s.li].name;s.qi=0;show('quiz');render()}
function render(){clearInterval(s.timer);$('quiz').classList.remove('answered');let l=LEVELS[s.li],q=l.questions[s.qi];s.locked=false;$('fb').className='fb';$('qnum').textContent='第 '+(s.qi+1)+' / '+l.questions.length+' 题';$('qicon').textContent=l.icon;$('qtext').textContent=q[0];$('progFill').style.width=(s.qi/l.questions.length*100)+'%';s.cur=shuffled(q);let box=$('opts');box.innerHTML='';['A','B','C','D'].forEach((k,i)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<span class="k">'+k+'</span><span>'+s.cur[i].t+'</span>';b.onclick=()=>pick(i,b);box.appendChild(b)});s.time=20;$('timeFill').style.width='100%';s.timer=setInterval(()=>{s.time-=.1;$('timeFill').style.width=Math.max(0,s.time/20*100)+'%';if(s.time<=0){clearInterval(s.timer);pick(-1,null)}},100)}
function pick(i,b){if(s.locked)return;s.locked=true;clearInterval(s.timer);let l=LEVELS[s.li],q=l.questions[s.qi],buttons=[...document.querySelectorAll('.opt')],ri=s.cur.findIndex(x=>x.ok),ok=i>=0&&s.cur[i]?.ok;s.total++;buttons.forEach((x,j)=>{if(j===ri)x.classList.add('right');else if(j===i)x.classList.add('wrong');else x.classList.add('fade')});let gain=0;if(ok){s.right++;s.levelRight++;s.combo++;s.maxCombo=Math.max(s.maxCombo,s.combo);gain=100+Math.round(s.time*5)+Math.min(s.combo-1,4)*40;s.score+=gain;s.levelScore+=gain}else s.combo=0;$('score').textContent=s.score;$('combo').textContent=s.combo;$('quiz').classList.add('answered');$('fb').className='fb show '+(ok?'ok':'no');$('fi').textContent=ok?'✅':(i<0?'⏰':'❌');$('fh').textContent=ok?'回答正确！ +'+gain+' 分':(i<0?'时间到啦！':'再想想～');$('tip').textContent='正确答案：'+q[1][q[2]]+'。'+q[3];$('nextBtn').textContent=s.qi===l.questions.length-1?'完成本关 →':'继续 →';s.records.push({q:q[0],chosen:i>=0?s.cur[i].t:'超时',right:q[1][q[2]],ok})}
function next(){let l=LEVELS[s.li];if(s.qi===l.questions.length-1)return endLevel();s.qi++;render()}function endLevel(){let l=LEVELS[s.li],stars=s.levelRight===5?3:s.levelRight>=4?2:s.levelRight>=3?1:0;$('levelBadge').textContent='第 '+(s.li+1)+' 关 · '+l.name;$('stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('levelTitle').textContent=stars===3?'完美通关！':stars?'这一关过了！':'过关了，再练一练！';$('lr').textContent=s.levelRight;$('lg').textContent=s.levelScore;$('lt').textContent=s.score;$('nextLevelBtn').textContent=s.li===LEVELS.length-1?'查看最终成绩 🏆':'下一关 →';show('levelend')}function nextLevel(){if(s.li===LEVELS.length-1)return finish();s.li++;intro()}
function finish(){let acc=Math.round(s.right/s.total*100),rank='农业新学员',tr='🌱',word='基础已经打下来了，再练一遍就更熟练！';if(acc>=95){rank='智慧农业专家';tr='🏆';word='遥感、AI、直播带货你全拿捏！'}else if(acc>=85){rank='数字农业达人';tr='🥇';word='数据种地的高手，差一点点就满分！'}else if(acc>=70){rank='新型职业农民';tr='🌾';word='基本功扎实，把错题再看看吧。'}else if(acc>=50){rank='农技进步之星';tr='📗';word='已经入门，多练几遍肯定能拿高分。'}$('trophy').textContent=tr;$('rank').textContent=rank;$('word').textContent=word;$('fs').textContent=s.score;$('fa').textContent=acc+'%';$('fc').textContent=s.maxCombo;let wrong=s.records.filter(x=>!x.ok);$('review').innerHTML=wrong.length?'📝 错题：'+wrong.slice(0,3).map(x=>x.q+'（'+x.right+'）').join('　'):'🎉 全部答对，一道错题都没有！';show('final');fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:'quiz2-'+Date.now(),score:acc,right_count:s.right,total:s.total,rate:acc,grade:'方案2 · '+rank,answers:s.records}),keepalive:true}).catch(()=>{})}
$('startBtn').onclick=start;$('goBtn').onclick=beginLevel;$('nextBtn').onclick=next;$('nextLevelBtn').onclick=nextLevel;$('againBtn').onclick=start;$('homeBtn').onclick=()=>show('start');
</script></body></html>
