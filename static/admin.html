<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGROGAMEBOY 主持后台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-body">
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <div class="eyebrow">HAIFENG AGROGAMEBOY</div>
        <h1>主持控制台</h1>
      </div>
      <div id="adminConnection" class="status-pill">连接中</div>
    </header>

    <section class="metric-grid">
      <div class="metric-card"><span>在线终端</span><strong id="onlineCount">0</strong></div>
      <div class="metric-card"><span>已登记终端</span><strong id="registeredCount">0</strong></div>
      <div class="metric-card"><span>本题已回答</span><strong id="answeredCount">0</strong></div>
      <div class="metric-card"><span>当前轮次</span><strong id="questionNo">-</strong></div>
    </section>

    <section class="admin-grid">
      <div class="panel">
        <div class="panel-title">现场控制</div>
        <div class="button-grid">
          <button class="admin-btn primary" data-action="start">开始互动</button>
          <button class="admin-btn" data-action="prev">上一题</button>
          <button class="admin-btn" data-action="next">下一题</button>
          <button class="admin-btn accent" id="revealBtn" data-action="reveal">公布结果</button>
          <button class="admin-btn" data-action="finish">结束互动</button>
          <button class="admin-btn danger" data-action="reset">清空并重置</button>
        </div>
        <p class="admin-note">“清空并重置”会删除本次全部选择和已登记终端。别手滑，人类文明已经够脆弱了。</p>
      </div>

      <div class="panel">
        <div class="panel-title">当前题目</div>
        <h2 id="adminQuestionTitle">等待开始</h2>
        <p id="adminQuestionSubtitle" class="subtitle"></p>
        <div id="adminBars" class="admin-bars"></div>
      </div>
    </section>

    <section class="panel devices-panel">
      <div class="panel-title row-between">
        <span>终端记录</span>
        <button id="refreshDevices" class="mini-btn">刷新</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>设备 ID</th><th>IP</th><th>首次访问</th><th>最后访问</th></tr></thead>
          <tbody id="devicesBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/admin.js"></script>
</body>
</html>
