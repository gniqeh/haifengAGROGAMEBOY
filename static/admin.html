<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>农业互动现场控制台</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f2f5f3;color:#19261f}.wrap{max-width:1280px;margin:0 auto;padding:26px 20px 46px}.card{background:#fff;border:1px solid #dce6df;border-radius:20px;box-shadow:0 8px 28px #17392310;padding:22px;margin-bottom:18px}.login{max-width:440px;margin:12vh auto}.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.login-brand img{height:58px;max-width:92px;object-fit:contain}.login h1{margin:0;font-size:27px}.row{display:flex;gap:10px}input{flex:1;padding:14px;border:1px solid #cbd8cf;border-radius:11px;font-size:16px}button,a.btn{border:0;border-radius:11px;padding:12px 17px;background:#126c3a;color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit}button:hover,a.btn:hover{filter:brightness(1.05)}button:disabled{opacity:.45;cursor:not-allowed}.muted{color:#718078;font-size:13px}.err{color:#b42318;margin-top:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:16px}.brand-logos{display:flex;align-items:center;gap:10px}.brand-logos img{height:62px;width:78px;object-fit:contain}.brand h1{margin:0;font-size:29px}.brand p{margin:5px 0 0;color:#728078;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.control{padding:0;overflow:hidden}.control-head{padding:20px 22px;background:linear-gradient(100deg,#0c6338,#147b4a);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:15px}.control-title{font-size:17px;font-weight:800}.live{display:flex;align-items:center;gap:9px;font-size:14px}.dot{width:10px;height:10px;border-radius:50%;background:#69f0ae;box-shadow:0 0 0 5px #69f0ae22,0 0 16px #69f0ae}.active-display{padding:22px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #e7eee9}.active-label{color:#738078;font-size:13px;margin-bottom:5px}.active-name{font-size:28px;font-weight:900;color:#145f37}.active-note{font-size:13px;color:#7b877f;text-align:right;line-height:1.7}.game-switch{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px 22px 22px}.game-btn{position:relative;padding:21px 22px;border-radius:17px;border:2px solid #dfe8e2;background:#f8faf8;color:#253129;text-align:left;cursor:pointer;min-height:126px;transition:.18s}.game-btn:hover{border-color:#8bb99e;background:#f4faf6}.game-btn b{display:block;font-size:21px;margin-bottom:8px}.game-btn span{font-size:14px;line-height:1.6;color:#68766d}.game-btn.active{border-color:#187344;background:#eaf6ef;box-shadow:0 0 0 4px #18734412}.game-btn.active b{color:#12683b}.game-btn.active:after{content:"正在展示";position:absolute;right:16px;top:15px;background:#176f42;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}.danger-note{margin:0 22px 22px;padding:12px 15px;background:#fff8e8;border:1px solid #f0ddb1;border-radius:12px;color:#765c20;font-size:13px;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:17px;border-radius:15px;background:#f4faf6;border:1px solid #e6eee8}.stat b{display:block;font-size:31px;margin-top:7px;color:#135f37}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tablebox{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px 10px;border-bottom:1px solid #edf1ee;text-align:left;font-size:14px}th{background:#f7f9f7;position:sticky;top:0;z-index:2}.tag{padding:4px 9px;border-radius:999px;background:#e8f5eb;color:#176f35;font-weight:700}.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-20px);opacity:0;pointer-events:none;background:#163f2a;color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;box-shadow:0 10px 30px #0003;transition:.22s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}dialog{border:0;border-radius:17px;max-width:780px;width:92%;padding:0;box-shadow:0 20px 60px #0005}dialog .inner{padding:22px}pre{white-space:pre-wrap;background:#f6f7f5;padding:14px;border-radius:10px;max-height:60vh;overflow:auto}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.game-switch{grid-template-columns:1fr}.top,.active-display{align-items:flex-start;flex-direction:column}.active-note{text-align:left}.brand-logos img{height:48px;width:60px}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="wrap">
<section id="login" class="card login">
  <div class="login-brand"><div><h1>农业互动现场控制台</h1><p class="muted">8831 展示控制与答题统计</p></div></div>
  <p class="muted">输入后台密码进入管理端。</p>
  <div class="row"><input id="pwd" type="password" placeholder="后台密码"><button id="loginBtn">登录</button></div><div id="err" class="err"></div>
</section>
<main id="main" hidden>
  <div class="top">
    <div class="brand">
      <div class="brand-logos"><img src="/static/assets/logo-haas.svg" alt="黑龙江省农业科学院"><img src="/static/assets/logo-arsi.svg" alt="农业遥感与信息研究所"></div>
      <div><h1>农业互动现场控制台</h1><p>会议触摸屏 · 端口 8831</p></div>
    </div>
    <div class="actions"><a class="btn" href="/" target="_blank">打开参与端</a><a class="btn" href="/api/admin/export.csv">导出 CSV</a><button id="logout">退出</button></div>
  </div>

  <section class="card control">
    <div class="control-head"><div class="control-title">现场展示控制</div><div class="live"><span class="dot"></span>8831 正在运行</div></div>
    <div class="active-display"><div><div class="active-label">当前所有会议屏正在展示</div><div class="active-name" id="activeName">读取中…</div></div><div class="active-note">参与端每约 2 秒检查一次展示模式<br>后台切换后会自动刷新全部已打开页面</div></div>
    <div id="gameSwitch" class="game-switch"></div>
    <div class="danger-note"><b>注意：</b>切换方案会中断正在进行中的答题，并让所有已经打开 8831 的参与端自动刷新。请在主持人确认后再切换。</div>
  </section>

  <section class="card"><div class="toolbar"><b>答题统计总览</b><span class="muted">当前为两套互动的汇总数据</span></div><div class="stats" style="margin-top:15px"><div class="stat">答题次数<b id="total">0</b></div><div class="stat">独立 IP<b id="ips">0</b></div><div class="stat">平均分<b id="avgScore">-</b></div><div class="stat">平均正确率<b id="avgRate">-</b></div><div class="stat">满分次数<b id="perfect">0</b></div></div></section>
  <section class="card"><div class="toolbar"><b>最近 500 条记录</b><span class="muted">点击一行查看逐题详情</span></div><div class="tablebox"><table><thead><tr><th>时间</th><th>IP</th><th>得分</th><th>答对</th><th>正确率</th><th>等级</th><th>浏览器</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
</div>
<dialog id="detail"><div class="inner"><div class="toolbar"><h3>答题详情</h3><button id="close">关闭</button></div><pre id="detailText"></pre></div></dialog>
<script src="/static/admin.js"></script>
</body></html>
