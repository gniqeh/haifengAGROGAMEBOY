<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>答题统计后台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:#f4f6f2;color:#1f2a1d}.wrap{max-width:1200px;margin:0 auto;padding:28px 18px}.card{background:#fff;border:1px solid #dfe7dc;border-radius:18px;box-shadow:0 8px 24px #26382012;padding:20px;margin-bottom:18px}h1{margin:0 0 18px;font-size:28px}.login{max-width:420px;margin:12vh auto}.row{display:flex;gap:10px}input{flex:1;padding:13px 14px;border:1px solid #cbd8c8;border-radius:10px;font-size:16px}button,a.btn{border:0;border-radius:10px;padding:12px 16px;background:#176f35;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.muted{color:#74806f;font-size:13px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:16px;border-radius:14px;background:#f4faf4}.stat b{display:block;font-size:30px;margin-top:6px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px 10px;border-bottom:1px solid #edf1eb;text-align:left;font-size:14px}th{background:#f7f9f6;position:sticky;top:0}.tag{padding:4px 9px;border-radius:999px;background:#e8f5eb;color:#176f35;font-weight:700}.err{color:#b42318;margin-top:10px}dialog{border:0;border-radius:16px;max-width:760px;width:92%;padding:0;box-shadow:0 20px 60px #0005}dialog .inner{padding:22px}pre{white-space:pre-wrap;background:#f6f7f5;padding:14px;border-radius:10px;max-height:60vh;overflow:auto}.game-switch{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.game-btn{padding:18px;border-radius:14px;border:2px solid #dfe7dc;background:#f8faf7;color:#243022;text-align:left;cursor:pointer}.game-btn b{display:block;font-size:20px;margin-bottom:4px}.game-btn.active{border-color:#176f35;background:#eaf6ed;box-shadow:0 0 0 3px #176f3518}.game-btn.active:after{content:"当前展示";float:right;margin-top:-28px;background:#176f35;color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}.switch-note{margin-top:12px;color:#60705d;font-size:13px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.game-switch{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><section id="login" class="card login"><h1>答题统计后台</h1><p class="muted">输入后台密码后查看答题记录。</p><div class="row"><input id="pwd" type="password" placeholder="后台密码"><button id="loginBtn">登录</button></div><div id="err" class="err"></div></section><main id="main" hidden><div class="toolbar"><h1>农业互动控制台</h1><div><a class="btn" href="/api/admin/export.csv">导出 CSV</a> <button id="logout">退出</button></div></div><section class="card"><b>8831 当前展示内容</b><div id="gameSwitch" class="game-switch"></div><div class="switch-note">切换后，新打开或刷新的参与端首页会显示所选方案。已经打开的页面不会被强制踢走。</div></section><section class="card"><div class="stats"><div class="stat">答题次数<b id="total">0</b></div><div class="stat">独立 IP<b id="ips">0</b></div><div class="stat">平均分<b id="avgScore">-</b></div><div class="stat">平均正确率<b id="avgRate">-</b></div><div class="stat">满分次数<b id="perfect">0</b></div></div></section><section class="card"><div class="toolbar"><b>最近 500 条记录</b><span class="muted">点击一行可查看逐题答案</span></div><div class="tablebox"><table><thead><tr><th>时间</th><th>IP</th><th>得分</th><th>答对</th><th>正确率</th><th>等级</th><th>浏览器</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><dialog id="detail"><div class="inner"><div class="toolbar"><h3>答题详情</h3><button id="close">关闭</button></div><pre id="detailText"></pre></div></dialog><script src="/static/admin.js"></script></body></html>
