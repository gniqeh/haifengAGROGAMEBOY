<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>智慧农场 · 三分钟决策挑战</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="participant-body">
  <main class="participant-shell">
    <header class="topbar">
      <div class="brand">智慧农场 · 三分钟决策挑战</div>
      <div id="connection" class="status-pill">连接中</div>
    </header>

    <section id="waitingView" class="center-card">
      <div class="hero-icon">🌾</div>
      <h1>欢迎进入数字农场</h1>
      <p>请等待主持人开始互动。</p>
      <div class="pulse-dot"></div>
    </section>

    <section id="questionView" class="question-card hidden">
      <div class="question-meta">
        <span id="progress">第 1 / 3 题</span>
        <span id="saveState">选择会自动保存</span>
      </div>
      <h1 id="questionTitle"></h1>
      <p id="questionSubtitle" class="subtitle"></p>
      <div id="options" class="options-grid"></div>
      <div id="hint" class="hint">你可以在公布结果前随时修改选择。</div>

      <section id="resultPanel" class="result-panel hidden">
        <h2>现场选择</h2>
        <div id="bars"></div>
        <div id="aiPanel" class="ai-panel hidden">
          <div id="aiLabel" class="ai-label"></div>
          <div id="aiReason" class="ai-reason"></div>
        </div>
      </section>
    </section>

    <section id="finishedView" class="center-card hidden">
      <div class="hero-icon">🤝</div>
      <h1>互动完成</h1>
      <p>人的经验 + AI 的计算，才是我们想做的智慧农业。</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
